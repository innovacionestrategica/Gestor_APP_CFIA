<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestor App CFIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="stripe"><i></i><b></b></div>
    <div class="brand"><img src="assets/cfia_logo_blanco.png" alt="CFIA"><small>Gestor de contenidos del App CFIA</small></div>
    <nav class="nav" id="nav" aria-label="Módulos"></nav>
    <div class="me" id="me"></div>
  </aside>
  <div class="main" id="main">
    <div class="topbar">
      <button class="iconbtn" id="menuBtn" aria-label="Abrir menú"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <img src="assets/cfia_logo_blanco.png" alt="CFIA">
    </div>
    <div class="wrap" id="view"></div>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="src/datos.js"></script>
<script src="src/app.js"></script>
</body>
</html>
